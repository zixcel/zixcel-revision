name: Verify Cargo distribution
on:
  push:
    branches: [main, release/crates-io-zixcel-revision-0.10.0-readme]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve archive names from current package manifests
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/archive_names.py"
      - name: Install the declared Rust toolchain
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97
      - name: Verify source and independent package
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo package --locked --all-features --registry crates-io
          sha256sum target/package/${PACKAGE_ARCHIVE_ZIXCEL_REVISION_CARGO}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zixcel-revision-reviewed-distribution
          path: target/package/${{ env.PACKAGE_ARCHIVE_ZIXCEL_REVISION_CARGO }}
          if-no-files-found: error
          retention-days: 7
